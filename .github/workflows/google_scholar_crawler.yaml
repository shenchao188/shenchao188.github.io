name: Update Google Scholar citation data

on:
  # Keep the existing Pages trigger, and allow an immediate retry from the
  # Actions tab after changing the Scholar ID or fixing a transient block.
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

# New repositories commonly default GITHUB_TOKEN to read-only.  This job
# publishes the generated JSON to the google-scholar-stats branch.
permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r google_scholar_crawler/requirements.txt
    - name: Fetch and publish citation data
      run: |
        cd ./google_scholar_crawler
        python main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add *.json
        # A successful crawl can legitimately return unchanged data. Do not
        # turn that no-op into a failed workflow run.
        if git diff --cached --quiet; then
          echo "Citation data is unchanged."
          exit 0
        fi
        git commit -m "Update citation data"
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
